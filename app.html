<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tokyo Trip</title>
  <meta name="theme-color" content="#0f1e4a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="top">
    <a href="index.html" class="brand" title="인트로 다시 보기">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#0f1e4a"/><circle cx="60" cy="60" r="22" fill="#e8483b"/><path d="M8 74 Q60 52 112 74" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
      TOKYO TRIP
    </a>
    <div id="who" class="who"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- 로그인 (Supabase 연결 시에만) -->
  <section id="login" class="panel login" hidden>
    <h2>로그인</h2>
    <p>이메일로 로그인 링크를 보내드려요. 비밀번호 없이 메일 속 링크만 누르면 끝!</p>
    <form id="loginForm" class="row">
      <input type="email" id="email" placeholder="you@example.com" required />
      <button class="btn primary">링크 받기</button>
    </form>
    <p id="loginMsg" class="hint"></p>
  </section>

  <main id="app" hidden>
    <!-- ① 번역 -->
    <section class="panel" data-tab="translate">
      <h2>번역 <small>한국어 → 일본어</small></h2>
      <div class="chips" id="phrases"></div>
      <textarea id="koText" rows="3" placeholder="예) 이거 하나 주세요. 고수는 빼주세요."></textarea>
      <div class="row">
        <button class="btn primary" id="btnTranslate">번역하기</button>
        <label class="btn ghost file">📷 메뉴판 사진
          <input type="file" id="menuPhoto" accept="image/*" capture="environment" hidden />
        </label>
      </div>
      <div id="trResult" class="card result" hidden></div>
      <div id="menuResult" class="card" hidden></div>
    </section>

    <!-- ② 일정 -->
    <section class="panel" data-tab="schedule" hidden>
      <h2>일정</h2>
      <div class="days" id="days"></div>
      <div id="map" class="map"><div class="map-empty">지도 키를 넣으면 여기에 구글지도가 보여요<br><small>js/config.js → GOOGLE_MAPS_API_KEY</small></div></div>
      <form id="addPlace" class="add">
        <input id="plTime" type="time" aria-label="시간" />
        <input id="plName" placeholder="장소 이름 (예: 시부야 스카이)" required />
        <input id="plMemo" placeholder="메모 (선택)" />
        <button class="btn primary">추가</button>
      </form>
      <ol id="dayList" class="list"></ol>
      <a id="routeLink" class="btn ghost wide" target="_blank" rel="noopener" hidden>🗺️ 구글지도 앱에서 이 날 경로 보기</a>
    </section>

    <!-- ③ 즐겨찾기 -->
    <section class="panel" data-tab="favorites" hidden>
      <h2>즐겨찾기 <small>가고 싶은 곳 막 저장!</small></h2>
      <form id="addFav" class="add">
        <input id="favName" placeholder="장소 이름 (예: 츠키지 장외시장)" required />
        <input id="favMemo" placeholder="메모 (선택)" />
        <button class="btn primary">저장</button>
      </form>
      <ul id="favList" class="list"></ul>
    </section>
  </main>

  <nav class="tabs" id="tabs" hidden>
    <button data-go="translate" class="on"><span>あ</span>번역</button>
    <button data-go="schedule"><span>📅</span>일정</button>
    <button data-go="favorites"><span>★</span>즐겨찾기</button>
  </nav>

  <!-- 크게 보여주기 (점원에게 화면 보여줄 때) -->
  <div id="show" class="show" hidden></div>
  <!-- Day 고르기 -->
  <dialog id="dayPick"><form method="dialog"><h3>몇 일차에 넣을까요?</h3><div id="dayPickBtns" class="chips"></div><button class="btn ghost wide" value="">취소</button></form></dialog>
  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
